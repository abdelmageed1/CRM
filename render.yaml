databases:
  - name: crm-db
    databaseName: crm_db
    user: crm_user
    plan: free

services:
  - type: web
    name: crm-system
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn crm_main.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
